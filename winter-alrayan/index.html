<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Winter AlRayan">
<meta property="og:description" content="مشروبات حارة وحلا الشتاء — اطلب أونلاين">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/duo.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23120d0a'/%3E%3Cg stroke='%23F3E9C8' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 12v40M14.7 22l34.6 20M14.7 42l34.6-20M26 14l6 6 6-6M26 50l6-6 6 6'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preload" href="assets/fonts/greatvibes-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Alexandria';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/alexandria-ar.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Alexandria';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/alexandria-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Great Vibes';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/greatvibes-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/outfit-latin.woff2) format('woff2')}

:root{--accent:#F3E9C8;--ink:#13200f;--bg:#120d0a;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.16);--wa:#25D366}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased;font-family:'Alexandria','Outfit',system-ui,sans-serif;overflow-x:hidden}
html[lang=en] body{font-family:'Outfit','Alexandria',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.script{font-family:'Great Vibes',cursive;font-weight:400;color:var(--accent);direction:ltr;word-spacing:.12em}
.glass{-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px -10px rgba(255,255,255,.7),0 10px 26px rgba(0,0,0,.3)}
.btn{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background-color .2s ease,opacity .2s ease,box-shadow .2s ease;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.42)}

/* fixed chrome */
#dev{position:fixed;z-index:31;top:max(14px,env(safe-area-inset-top));left:14px;width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff}
#devPop{position:fixed;z-index:31;top:calc(max(14px,env(safe-area-inset-top)) + 58px);left:14px;width:min(280px,calc(100vw - 28px));padding:16px;border-radius:22px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.3);transform-origin:24px 0;animation:pop .22s cubic-bezier(.2,.8,.3,1) both}
#devPop[hidden]{display:none}
#devPop a{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);text-decoration:none;font-size:15px;font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.92)}to{opacity:1;transform:none}}
#orderPill{position:fixed;z-index:30;top:max(16px,env(safe-area-inset-top));right:14px;height:46px;padding:0 16px 0 13px;border-radius:999px;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;transition:opacity .3s ease,transform .3s ease}
#orderPill .count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
#orderPill .count[hidden]{display:none}
#dev{transition:opacity .3s ease,transform .3s ease}
body.in-menu #orderPill,body.in-menu #dev{opacity:0;pointer-events:none;transform:translateY(-10px)}
body.in-menu #devPop{display:none}

/* hero: scroll-scrubbed clips on a fixed canvas */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:var(--bg)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(18,13,10,.5) 0%,rgba(18,13,10,0) 15%,rgba(18,13,10,0) 80%,rgba(18,13,10,.5) 100%)}
#hero{position:relative;z-index:2;height:430vh}
#stage{position:sticky;top:0;height:100vh;overflow:hidden;pointer-events:none}
.vig{background:linear-gradient(180deg,rgba(18,13,10,.55) 0%,rgba(18,13,10,0) 16%,rgba(18,13,10,0) 74%,rgba(18,13,10,.72) 100%)}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0}
/* the formula above the matcha clip */
.formula{position:absolute;left:0;right:0;bottom:min(calc(50vh + 28.125vw + 18px),calc(100vh - 190px));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px;opacity:var(--e,0);text-align:center}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(243,233,200,.85)}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:13px}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:rgba(243,233,200,.6)}
.eq{display:flex;flex-direction:column;align-items:center;gap:.06em;font-size:clamp(30px,min(10.5vw,6.5vh),84px);font-weight:700;letter-spacing:-.035em;line-height:1.02;text-shadow:0 6px 34px rgba(0,0,0,.45)}
html[lang=ar] .eq{letter-spacing:0;line-height:1.25}
.eq>span{display:flex;align-items:baseline;gap:.22em;will-change:transform,opacity,filter}
.eq>span:nth-child(1){opacity:var(--r1,0);transform:translateY(calc((1 - var(--r1,0)) * .5em));filter:blur(calc((1 - var(--r1,0)) * 10px))}
.eq>span:nth-child(2){opacity:var(--r2,0);transform:translateY(calc((1 - var(--r2,0)) * .5em));filter:blur(calc((1 - var(--r2,0)) * 10px))}
.eq>span:nth-child(3){opacity:var(--r3,0);transform:translateY(calc((1 - var(--r3,0)) * .5em));filter:blur(calc((1 - var(--r3,0)) * 10px))}
.eq .op{font-weight:300;color:var(--accent);opacity:.9}
.eq .matcha{background:linear-gradient(100deg,#d4ee9e 0%,#9fca5c 45%,#F3E9C8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 26px rgba(0,0,0,.4))}
.eq .bag{font-family:'Great Vibes',cursive;font-weight:400;font-size:1.32em;letter-spacing:0;color:var(--accent);line-height:.9}
html[lang=ar] .eq .bag{font-family:inherit;font-size:1em;font-weight:700;line-height:inherit}
@media (min-aspect-ratio:4/5){.formula{bottom:calc(100vh - 330px)}}
/* logo under the matcha clip */
.brand{position:absolute;left:0;right:0;top:min(calc(50vh + 28.125vw + 14px),calc(100vh - 210px));display:flex;flex-direction:column;align-items:center;gap:4px;opacity:var(--lg,0);transform:translateY(calc((1 - var(--lg,0)) * 18px))}
.brand .script{font-size:clamp(44px,12.5vw,110px);line-height:1.1;white-space:nowrap;text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.55),0 0 30px rgba(243,233,200,.22)}
.brand p{margin:0;font-size:clamp(13px,3.6vw,17px);color:rgba(255,255,255,.82)}
#loadBar{position:absolute;left:50%;top:max(80px,calc(env(safe-area-inset-top) + 70px));width:min(140px,40vw);height:3px;margin-left:calc(min(140px,40vw) / -2);border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;transition:opacity .4s}
#loadBar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loadBar.done{opacity:0}
.hint{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));z-index:2;display:flex;justify-content:center;opacity:var(--ca,1)}
.hint.keep{opacity:var(--ck,0)}
.hint>div{display:flex;align-items:center;gap:8px;padding:11px 16px 11px 20px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.01em;color:#fff;background:rgba(14,10,8,.58);border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.35);text-shadow:none}
.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* menu sheet */
#menu{position:relative;z-index:5;min-height:100vh;margin-top:-12vh;border-radius:30px 30px 0 0;border-top:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 -24px 60px rgba(0,0,0,.35);padding:70px 4vw max(36px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);background:rgba(255,255,255,.06)}
#win{position:relative;width:min(100%,560px);transform:translateY(calc((1 - var(--q,1)) * 16vh));will-change:transform}
.duoWrap{display:flex;justify-content:flex-end;padding-right:4%;margin-bottom:-8px;position:relative;z-index:3}
.duo{width:min(46vw,280px);transform-origin:70% 85%;opacity:0;transform:rotate(5deg)}
.duo.in{animation:slap .75s cubic-bezier(.2,.75,.25,1) both}
.duo>div{background:#fff;padding:7px;border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.45)}
.duo img{display:block;width:100%;height:auto;aspect-ratio:1000/558;border-radius:10px}
@keyframes slap{0%{opacity:0;transform:translate(12%,-45%) scale(2.2) rotate(-18deg)}60%{opacity:1;transform:translate(0,0) scale(.93) rotate(7deg)}80%{transform:scale(1.03) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(5deg)}}
.pane{position:relative;border-radius:30px;overflow:hidden;border:1px solid rgba(232,240,205,.32);box-shadow:0 34px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);background:rgba(26,44,24,.45)}
.pane::before{content:"";position:absolute;inset:0;background:url(assets/glass.jpg) center/cover no-repeat;opacity:.75;pointer-events:none}
.pane::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,6,.12),rgba(6,14,6,.5) 28%,rgba(5,12,5,.78));pointer-events:none}
.paneIn{position:relative;z-index:1;padding:20px 16px 16px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head .script{font-size:34px;line-height:1;white-space:nowrap;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.seg{display:flex;flex:none;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.seg button{min-width:44px;height:36px;border-radius:999px;background:transparent;color:rgba(255,255,255,.78);font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--ink)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:rgba(255,255,255,.5);text-align:center}
.steps li::before{content:"";height:4px;border-radius:2px;background:rgba(255,255,255,.16);transition:background .3s}
.steps li.done::before,.steps li.cur::before{background:var(--accent)}
.steps li.cur{color:var(--accent);font-weight:600}
.steps li.done{color:rgba(255,255,255,.8)}

.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.tabs button{height:44px;border-radius:12px;background:transparent;color:rgba(255,255,255,.78);font-size:14px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px 12px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .2s,border-color .2s}
.tile.on{background:rgba(243,233,200,.15);border-color:rgba(243,233,200,.65)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .ph{display:block;height:72px;width:auto;max-width:64%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(243,233,200,.12);border:1px solid rgba(243,233,200,.22);color:var(--accent)}
.badge{min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--accent);color:var(--ink);font-size:14px;font-weight:700;display:grid;place-items:center}
.tile .nm{font-size:16px;font-weight:600;line-height:1.2;margin-top:4px}
.tile .ds{font-size:13px;line-height:1.4;color:rgba(255,255,255,.7);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tile .pr{margin-top:auto;padding-top:4px;font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap}
.add{height:42px;border-radius:13px;border:1px solid rgba(243,233,200,.4)!important;background:rgba(243,233,200,.12);color:var(--accent);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -8px 14px -10px rgba(243,233,200,.9)}
.stepper{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;height:42px;border-radius:13px;background:var(--accent);color:var(--ink)}
.stepper button{height:42px;background:transparent;color:inherit;display:grid;place-items:center;padding:0}
.stepper span{text-align:center;font-size:15px;font-weight:700}

.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding-block:7px;padding-inline:18px 7px;border-radius:19px;background:var(--accent);color:var(--ink);box-shadow:0 14px 30px -12px rgba(243,233,200,.7)}
.cta .l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:start}
.cta .l small{font-size:13px;opacity:.75}
.cta .l b{font-size:17px;white-space:nowrap}
.cta .r{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 15px;border-radius:14px;background:var(--ink);color:var(--accent);font-size:15px;font-weight:600;white-space:nowrap}
.primary{min-height:54px;width:100%;border-radius:17px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 30px -12px rgba(243,233,200,.7)}
.ghost{min-height:48px;width:100%;border-radius:15px;border:1px solid rgba(243,233,200,.45)!important;background:rgba(243,233,200,.12);color:var(--accent);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.waBtn{background:var(--wa);color:#06260f;box-shadow:0 14px 30px -12px rgba(37,211,102,.7)}

.bar{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.22)!important;background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center;padding:0}
.bar h2{margin:0;font-size:21px;font-weight:600}
.card{border-radius:20px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.14);padding:4px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.line .n{flex:1 1 auto;min-width:0}
.line .n b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.line .n small{font-size:13px;color:rgba(255,255,255,.6)}
.qty{display:flex;align-items:center;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.18)}
.qty button{width:38px;height:38px;background:transparent;color:#fff;display:grid;place-items:center;padding:0}
.qty span{min-width:20px;text-align:center;font-size:15px;font-weight:700}
.line .s{min-width:62px;text-align:end;font-size:15px;font-weight:600;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 10px;font-size:18px;font-weight:700}
.tot span:last-child{color:var(--accent);white-space:nowrap}
.field{display:block;font-size:13px;color:rgba(255,255,255,.75)}
.field input,.field textarea{display:block;margin-top:6px;width:100%;min-height:48px;border-radius:13px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.3);color:#fff;font-size:16px;padding:12px}
.field textarea{resize:none;height:76px;line-height:1.4}
.field.err input{border-color:#ff9c8a}
.err-msg{color:#ffb4a6;font-size:12.5px;margin-top:6px}
.err-msg:empty{display:none}

.pay{border-radius:20px;padding:16px;background:rgba(243,233,200,.1);border:1px solid rgba(243,233,200,.38)}
.pay .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--accent)}
.amount{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.amount b{font-size:26px;white-space:nowrap}
.num{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 12px 12px 14px;border-radius:16px;background:rgba(0,0,0,.3);border:1px dashed rgba(243,233,200,.45)}
.num .v{font-family:'Outfit',sans-serif;font-size:22px;font-weight:600;letter-spacing:.03em;white-space:nowrap;direction:ltr;user-select:all;-webkit-user-select:all}
.copy{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(243,233,200,.45)!important;background:rgba(243,233,200,.14);color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.copy.ok{background:var(--accent);color:var(--ink)}
.how{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:h}
.how li{display:flex;gap:10px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82);counter-increment:h}
.how li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(243,233,200,.18);color:var(--accent);font-size:12px;font-weight:700;margin-top:1px}
.note{font-size:13px;color:rgba(255,255,255,.62);line-height:1.5;text-align:center}

.ticket{background:var(--accent);color:var(--ink);border-radius:22px;padding:20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.ticket .script{color:var(--ink);font-size:30px;line-height:1}
.ticket .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ticket small{font-size:13px;opacity:.68}
.ticket .who{font-size:28px;font-weight:700;line-height:1.15}
.ticket .no{font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:.04em;direction:ltr;display:block}
.dash{border-top:1.5px dashed rgba(19,32,15,.3);margin:14px 0 10px}
.ticket .row{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:6px}
.ticket .row b{white-space:nowrap}
.ticket .big{display:flex;justify-content:space-between;font-size:19px;font-weight:700}

    heroOn = sn > 0 && top > 0;
    snowEl.style.opacity = sn.toFixed(3);
    document.body.classList.toggle('in-menu', top < vh * 0.6);
    var q = still ? 1 : clamp01((vh - top) / (vh * 0.75));
    var qe = 1 - Math.pow(1 - q, 3);
    win.style.setProperty('--q', qe.toFixed(4));
    if (qe > 0.8) duo.classList.add('in');
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }
  window.addEventListener('scroll', kick, { passive: true });
  window.addEventListener('resize', function () { dirty = true; kick(); });

  /* ---------- snow ---------- */
  (function snow() {
    var cv = $('#snow'); if (!cv || still) return;
    var ctx = cv.getContext('2d'), flakes = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    function size() {
      W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(110, W * H / 9000));
      while (flakes.length < n) flakes.push(mk(true));
      flakes.length = n;
    }
    function mk(any) { return { x: Math.random() * W, y: any ? Math.random() * H : -6, r: Math.random() * 2.2 + 0.6, s: Math.random() * 0.6 + 0.35, w: Math.random() * Math.PI * 2, a: Math.random() * 0.5 + 0.35 }; }
    var last = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      if (!heroOn || document.hidden) return;
      var dt = Math.min(50, ts - (last || ts)) / 16.7; last = ts;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.y += f.s * dt; f.w += 0.012 * dt; f.x += Math.sin(f.w) * 0.35 * dt;
        if (f.y > H + 6) flakes[i] = mk(false);
        ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fillStyle = '#fff'; ctx.fill();
      }
    }
    size(); window.addEventListener('resize', size); requestAnimationFrame(frame);
  })();

  render();
  kick();
  // returning from WhatsApp / reload mid-order: jump straight to the order window
  if (S.step !== 'menu') setTimeout(function () { window.scrollTo(0, window.scrollY + $('#win').getBoundingClientRect().top - 70); kick(); }, 0);
})();
</script>
